services:

  # ============================================
  # PostgreSQL
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: petdiary_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petdiary}
      POSTGRES_USER: ${POSTGRES_USER:-petdiary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petdiary}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rede
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petdiary} -d ${POSTGRES_DB:-petdiary}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # ============================================
  # API — Django REST
  # ============================================
  api:
    build:
      context: ./petDiary-backend/backend
      dockerfile: Dockerfile
    container_name: petdiary_api
    restart: unless-stopped
    env_file: ${PATH_ENV_FILE:-.env.local}
    command: ${API_CMD:-python manage.py runserver 0.0.0.0:8000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ${API_VOLUMES:-./petDiary-backend/backend:/app}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede

  # ============================================
  # Web — React + Vite (Veterinário)
  # ============================================
  web:
    build:
      context: ./petDiary-frontend-web
      dockerfile: Dockerfile
    container_name: petdiary_web
    restart: unless-stopped
    env_file: ${PATH_ENV_FILE:-.env.local}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ${WEB_VOLUMES:-./petDiary-frontend-web:/app}
      - /app/node_modules
    depends_on:
      - api
    networks:
      - rede

  # ============================================
  # Mobile — Expo / React Native (Tutor)
  # ============================================
  mobile:
    build:
      context: ./petDiary-frontend-mobile
      dockerfile: Dockerfile
    container_name: petdiary_mobile
    restart: unless-stopped
    env_file: ${PATH_ENV_FILE:-.env.local}
    ports:
      - "${MOBILE_PORT:-8081}:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:-192.168.1.100}
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ${MOBILE_VOLUMES:-./petDiary-frontend-mobile:/app}
      - /app/node_modules
    depends_on:
      - api
    stdin_open: true
    tty: true
    profiles:
      - mobile
      - local
    networks:
      - rede

  # ============================================
  # Caddy — reverse proxy (opcional, perfis dev/hom/prod)
  # ============================================
  caddy:
    image: caddy:2.10-alpine
    container_name: petdiary_caddy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "${CADDY_PORT:-80}:80"
      - "${CADDY_PORT_HTTPS:-443}:443"
    env_file: ${PATH_ENV_FILE:-.env.local}
    volumes:
      - ./caddy:/etc/caddy
      - caddy_data:/data
    depends_on:
      - api
      - web
    networks:
      - rede
    profiles:
      - dev
      - hom
      - prod

volumes:
  pgdata:
  caddy_data:

networks:
  rede:
    driver: bridge
    name: petdiary_net
