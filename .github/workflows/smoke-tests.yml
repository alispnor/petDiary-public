name: Smoke tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  pytest:
    name: pytest -m smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: petdiary
          POSTGRES_USER: petdiary
          POSTGRES_PASSWORD: petdiary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petdiary -d petdiary"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://petdiary:petdiary@localhost:5432/petdiary
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: "True"
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: petDiary-backend/backend/requirements.txt

      - name: Install dependencies
        working-directory: petDiary-backend/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: petDiary-backend/backend
        run: python manage.py migrate --noinput

      - name: Run smoke tests
        working-directory: petDiary-backend/backend
        run: pytest -m smoke -v
