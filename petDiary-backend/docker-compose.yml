services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: petdiary
      POSTGRES_USER: petdiary
      POSTGRES_PASSWORD: petdiary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petdiary"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://petdiary:petdiary@db:5432/petdiary
    depends_on:
      db:
        condition: service_healthy

  mobile:
    build:
      context: ../petDiary-frontend-mobile
      dockerfile: Dockerfile
    volumes:
      - ../petDiary-frontend-mobile:/app
      - /app/node_modules
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP:-192.168.1.100}
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
    stdin_open: true
    tty: true

  web:
    build:
      context: ../petDiary-frontend-web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../petDiary-frontend-web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://api:8000/api/v1
    depends_on:
      - api

volumes:
  pgdata:
